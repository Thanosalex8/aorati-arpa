<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>Αόρατη Άρπα</title>
<style>
  :root{--bg:#05060a;--fg:#e8ecf5;--dim:#8a93a8;--acc:#7cf3ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .bar{position:fixed;left:0;right:0;display:flex;gap:6px;padding:8px 10px;z-index:2;align-items:center;flex-wrap:wrap;pointer-events:none}
  .bar>*{pointer-events:auto}
  .top{top:0;padding-top:max(8px,env(safe-area-inset-top))}
  .bottom{bottom:0;padding-bottom:max(10px,env(safe-area-inset-bottom));justify-content:center}
  .title{font-weight:700;letter-spacing:.04em;font-size:15px;margin-right:auto}
  .title small{display:block;font-weight:400;color:var(--dim);font-size:11px;letter-spacing:0}
  button,select{font:inherit;font-size:13px;color:var(--fg);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  button.on{background:rgba(124,243,255,.18);border-color:var(--acc);color:var(--acc)}
  .snd{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:2px;scrollbar-width:none}
  .snd::-webkit-scrollbar{display:none}
  .snd button{white-space:nowrap}
  #hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--dim);font-size:15px;line-height:1.55;pointer-events:none;z-index:1;width:min(320px,86vw);transition:opacity .5s}
  #hint b{color:var(--fg)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="bar top">
  <div class="title">Αόρατη Άρπα<small id="count">0 χορδές</small></div>
  <button id="scaleBtn" class="on" title="Κούμπωμα σε κλίμακα">Κλίμακα</button>
  <button id="undo">Αναίρεση</button>
  <button id="clear">Καθαρισμός</button>
</div>

<div class="bar bottom">
  <div class="snd" id="sounds"></div>
</div>

<div id="hint">
  <b>Πάτα ένα σημείο</b> και μετά <b>ένα δεύτερο</b><br>για να τεντώσεις μια χορδή.<br><br>
  <b>Σύρε το δάχτυλο</b> πάνω από τις χορδές<br>για να τις παίξεις.<br><br>
  Κοντή χορδή = ψηλή νότα · μακριά = μπάσα
</div>

<script>
(() => {
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

/* ---------- Audio ---------- */
let ac=null, master=null, verb=null;
function initAudio(){
  if(ac){ if(ac.state!=='running') ac.resume(); return; }
  ac = new (window.AudioContext||window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value=0.8;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
  master.connect(comp); comp.connect(ac.destination);
  // simple reverb (generated impulse)
  verb = ac.createConvolver();
  const len = ac.sampleRate*2.2, ir = ac.createBuffer(2,len,ac.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  verb.buffer=ir; const vg=ac.createGain(); vg.gain.value=0.28; verb.connect(vg); vg.connect(comp);
  // iOS unlock
  const b=ac.createBuffer(1,1,22050), s=ac.createBufferSource(); s.buffer=b; s.connect(ac.destination); s.start(0);
}

const ksCache = new Map();
function karplus(freq, decay, bright, dur){
  const key = freq.toFixed(1)+'|'+decay+'|'+bright;
  if(ksCache.has(key)) return ksCache.get(key);
  const sr=ac.sampleRate, n=Math.floor(sr*dur), buf=ac.createBuffer(1,n,sr), d=buf.getChannelData(0);
  const N=Math.max(2,Math.round(sr/freq)), ring=new Float32Array(N);
  let prev=0;
  for(let i=0;i<N;i++){ const r=Math.random()*2-1; prev = prev + bright*(r-prev); ring[i]=prev; }
  let idx=0;
  for(let i=0;i<n;i++){
    const a=ring[idx], b=ring[(idx+1)%N];
    const v=decay*0.5*(a+b);
    d[i]=a; ring[idx]=v; idx=(idx+1)%N;
  }
  ksCache.set(key,buf); if(ksCache.size>200) ksCache.delete(ksCache.keys().next().value);
  return buf;
}
function out(node, vel, wet){
  const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
  const g = ac.createGain(); g.gain.value = vel;
  node.connect(g);
  if(pan){ pan.pan.value = (Math.random()-.5)*.5; g.connect(pan); pan.connect(master); if(wet) pan.connect(verb);}
  else { g.connect(master); if(wet) g.connect(verb); }
}
function envOsc(type,freq,t,a,dec,peak,dest,detune=0){
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.value=freq; o.detune.value=detune;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+a+dec+.05); return o;
}

const SOUNDS = {
  guitar:{name:'Κιθάρα', hue:35, play(f,v){ const s=ac.createBufferSource(); s.buffer=karplus(f,0.996,0.55,2.5); out(s,v*0.9,true); s.start(); }},
  harp:{name:'Άρπα', hue:190, play(f,v){ const s=ac.createBufferSource(); s.buffer=karplus(f,0.9985,0.22,3.5); const lp=ac.createBiquadFilter(); lp.frequency.value=f*6; s.connect(lp); out(lp,v*1.3,true); s.start(); }},
  bouzouki:{name:'Μπουζούκι', hue:50, play(f,v){ f*=2; [0,1].forEach(k=>{ const s=ac.createBufferSource(); s.buffer=karplus(f*(k?1.004:1),0.994,0.9,2); out(s,v*0.55,true); s.start(ac.currentTime+k*0.012); }); }},
  bell:{name:'Καμπάνα', hue:280, play(f,v){ const t=ac.currentTime, bus=ac.createGain(); out(bus,v*0.5,true);
      f*=2; [[1,1,3],[2.76,.5,1.6],[5.4,.25,.9],[8.93,.12,.5]].forEach(([r,a,d])=>envOsc('sine',f*r,t,0.004,d,a,bus)); }},
  synth:{name:'Synth', hue:320, play(f,v){ const t=ac.currentTime, lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=6;
      lp.frequency.setValueAtTime(f*12,t); lp.frequency.exponentialRampToValueAtTime(f*1.5,t+0.6); out(lp,v*0.35,true);
      envOsc('sawtooth',f,t,0.01,1.4,0.6,lp,-7); envOsc('sawtooth',f,t,0.01,1.4,0.6,lp,7); envOsc('square',f/2,t,0.01,1.2,0.3,lp); }},
  marimba:{name:'Μαρίμπα', hue:120, play(f,v){ const t=ac.currentTime, bus=ac.createGain(); out(bus,v*0.8,false);
      f*=2; envOsc('sine',f,t,0.003,0.9,0.8,bus); envOsc('sine',f*3.93,t,0.002,0.18,0.25,bus); envOsc('sine',f*9.2,t,0.001,0.05,0.08,bus); }},
  bass:{name:'Μπάσο', hue:0, play(f,v){ f/=2; const s=ac.createBufferSource(); s.buffer=karplus(Math.max(f,30),0.997,0.35,2.5); const lp=ac.createBiquadFilter(); lp.frequency.value=900; s.connect(lp); out(lp,v*1.6,false); s.start(); }},
};
let sound='harp';

/* ---------- Pitch ---------- */
const NOTE_NAMES=['Ντο','Ντο#','Ρε','Ρε#','Μι','Φα','Φα#','Σολ','Σολ#','Λα','Λα#','Σι'];
const PENTA=[0,2,4,7,9];
let snap=true;
function pitchFor(len){
  const diag=Math.hypot(W,H);
  const x=Math.min(1,Math.max(0,len/diag));           // 0 short .. 1 long
  let midi = 45 + (1-Math.sqrt(x))*36;                // ~A2 .. A5
  if(snap){
    let best=null,bd=1e9;
    for(let m=36;m<=96;m++){ if(!PENTA.includes(((m-48)%12+12)%12)) continue; const d=Math.abs(m-midi); if(d<bd){bd=d;best=m;} }
    midi=best;
  }
  const freq=440*Math.pow(2,(midi-69)/12);
  const r=Math.round(midi);
  return {freq, midi, label: NOTE_NAMES[((r%12)+12)%12] + (snap? '' : '~')};
}

/* ---------- Strings ---------- */
const strings=[];
function addString(a,b){
  const len=Math.hypot(b.x-a.x,b.y-a.y); if(len<30) return;
  const p=pitchFor(len);
  strings.push({a,b,len,...p,amp:0,phase:0,pos:.5,t0:0,born:performance.now(),hue:SOUNDS[sound].hue+((p.midi%12)*9)});
  updCount(); hideHint();
}
function retune(){ strings.forEach(s=>Object.assign(s,pitchFor(s.len))); }
function updCount(){ document.getElementById('count').textContent = strings.length+(strings.length===1?' χορδή':' χορδές'); }

function segX(p1,p2,p3,p4){ // returns t along p3-p4 if segments intersect
  const d=(p2.x-p1.x)*(p4.y-p3.y)-(p2.y-p1.y)*(p4.x-p3.x); if(Math.abs(d)<1e-9) return -1;
  const u=((p3.x-p1.x)*(p4.y-p3.y)-(p3.y-p1.y)*(p4.x-p3.x))/d;
  const t=((p3.x-p1.x)*(p2.y-p1.y)-(p3.y-p1.y)*(p2.x-p1.x))/d;
  return (u>=0&&u<=1&&t>=0&&t<=1)?t:-1;
}
function pluck(s,t,speed){
  const now=performance.now(); if(now-s.t0<45) return;
  const v=Math.min(1,0.35+speed/2.2);
  s.amp=Math.min(22, 8+speed*9); s.pos=Math.min(.9,Math.max(.1,t)); s.t0=now;
  SOUNDS[sound].play(s.freq,v);
  if(navigator.vibrate) try{navigator.vibrate(8)}catch(e){}
  sparks(s,t);
}

/* ---------- Particles ---------- */
const parts=[];
function sparks(s,t){
  const x=s.a.x+(s.b.x-s.a.x)*t, y=s.a.y+(s.b.y-s.a.y)*t;
  for(let i=0;i<14;i++){const an=Math.random()*Math.PI*2, sp=1+Math.random()*3.5;
    parts.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,life:1,hue:s.hue});}
}

/* ---------- Input ---------- */
let pending=null;          // first anchor waiting for second tap
const ptrs=new Map();
cv.addEventListener('pointerdown',e=>{
  initAudio(); cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,t:performance.now(),moved:false,trail:[]});
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for(const ev of (evs.length?evs:[e])){
    const nx=ev.clientX, ny=ev.clientY, now=performance.now();
    if(!p.moved && Math.hypot(nx-p.x0,ny-p.y0)>12) p.moved=true;
    if(p.moved){
      const dt=Math.max(1,now-p.t), speed=Math.hypot(nx-p.x,ny-p.y)/dt;
      for(const s of strings){ const t=segX({x:p.x,y:p.y},{x:nx,y:ny},s.a,s.b); if(t>=0) pluck(s,t,speed); }
      p.trail.push({x:nx,y:ny,life:1});
    }
    p.x=nx;p.y=ny;p.t=now;
  }
});
function up(e){
  const p=ptrs.get(e.pointerId); if(!p) return; ptrs.delete(e.pointerId);
  trails.push(...p.trail);
  if(p.moved || e.type==='pointercancel') return;
  const pt={x:p.x0,y:p.y0};
  if(!pending){ pending={...pt,born:performance.now()}; tick(660,0.15); }
  else { addString(pending,pt); pending=null; }
}
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
const trails=[];
function tick(f,v){ if(!ac) return; const t=ac.currentTime,g=ac.createGain(); g.connect(master); envOsc('sine',f,t,0.002,0.08,v,g); }

/* ---------- UI ---------- */
const sw=document.getElementById('sounds');
Object.entries(SOUNDS).forEach(([k,s])=>{
  const b=document.createElement('button'); b.textContent=s.name; b.dataset.k=k; if(k===sound)b.classList.add('on');
  b.onclick=()=>{initAudio(); sound=k; [...sw.children].forEach(x=>x.classList.toggle('on',x.dataset.k===k));
    strings.forEach(st=>st.hue=s.hue+((st.midi%12)*9)); };
  sw.appendChild(b);
});
document.getElementById('undo').onclick=()=>{ if(pending){pending=null;return;} strings.pop(); updCount(); };
document.getElementById('clear').onclick=()=>{ strings.length=0; pending=null; updCount(); };
const sb=document.getElementById('scaleBtn');
sb.onclick=()=>{ snap=!snap; sb.classList.toggle('on',snap); retune(); };
const hint=document.getElementById('hint');
function hideHint(){ hint.style.opacity=0; }
['pointerdown','pointermove','pointerup'].forEach(ev=>document.querySelectorAll('.bar').forEach(b=>b.addEventListener(ev,e=>e.stopPropagation())));

/* ---------- Render ---------- */
function frame(now){
  cx.globalCompositeOperation='source-over';
  cx.fillStyle='rgba(5,6,10,0.35)'; cx.fillRect(0,0,W,H);
  cx.globalCompositeOperation='lighter';

  for(const s of strings){
    const dx=s.b.x-s.a.x, dy=s.b.y-s.a.y, L=s.len, nx=-dy/L, ny=dx/L;
    const el=(now-s.t0)/1000;
    const amp = s.amp*Math.exp(-el*2.2);
    const w = Math.min(60, s.freq/6);
    const grow=Math.min(1,(now-s.born)/250);
    const col=`hsl(${s.hue},95%,${60+Math.min(25,amp*1.5)}%)`;
    cx.lineCap='round';
    for(const [lw,al] of [[10,0.08],[4,0.25],[1.6,1]]){
      cx.beginPath();
      const segs=40;
      for(let i=0;i<=segs;i++){
        const u=i/segs*grow;
        let off=0;
        if(amp>0.05){
          // plucked shape (triangle at pluck pos) evolving as standing wave
          const tri = u<s.pos ? u/s.pos : (1-u)/(1-s.pos);
          off = amp*(0.6*tri*Math.cos(el*w) + 0.4*Math.sin(Math.PI*u)*Math.sin(el*w*1.7));
        }
        const x=s.a.x+dx*u+nx*off, y=s.a.y+dy*u+ny*off;
        i?cx.lineTo(x,y):cx.moveTo(x,y);
      }
      cx.strokeStyle=col; cx.globalAlpha=al; cx.lineWidth=lw; cx.stroke();
    }
    cx.globalAlpha=1;
    for(const p of [s.a,s.b]){ cx.beginPath(); cx.arc(p.x,p.y,4,0,7); cx.fillStyle=col; cx.fill(); }
    cx.globalAlpha=0.55; cx.fillStyle='#fff'; cx.font='11px system-ui'; cx.textAlign='center';
    cx.fillText(s.label, s.a.x+dx*.5+nx*-14, s.a.y+dy*.5+ny*-14); cx.globalAlpha=1;
  }

  if(pending){
    const pulse=8+Math.sin(now/180)*3;
    cx.beginPath(); cx.arc(pending.x,pending.y,pulse,0,7); cx.strokeStyle='rgba(124,243,255,.9)'; cx.lineWidth=2; cx.stroke();
    cx.beginPath(); cx.arc(pending.x,pending.y,3,0,7); cx.fillStyle='#7cf3ff'; cx.fill();
  }

  for(const p of ptrs.values()) for(const t of p.trail) trails.push(t);
  for(const p of ptrs.values()) p.trail.length=0;
  for(let i=trails.length-1;i>=0;i--){ const t=trails[i]; t.life-=0.05; if(t.life<=0){trails.splice(i,1);continue;}
    cx.beginPath(); cx.arc(t.x,t.y,5*t.life,0,7); cx.fillStyle=`rgba(180,240,255,${t.life*0.35})`; cx.fill(); }

  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vx*=.95; p.vy*=.95; p.life-=0.03;
    if(p.life<=0){parts.splice(i,1);continue;}
    cx.beginPath(); cx.arc(p.x,p.y,2.2*p.life,0,7); cx.fillStyle=`hsla(${p.hue},100%,75%,${p.life})`; cx.fill(); }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
